# Real run: ~5.8M parameters. max_steps and num_threads are placeholders until
# `tinygpt bench` (Phase 5) measures throughput.
name = "small"
seed = 1337

[model]
vocab_size = 4096
context_length = 256
d_model = 256
n_layer = 6
n_head = 8
dropout = 0.1
attention_impl = "sdpa"

[data]
source = "tinystories"
train_stories = 300000
val_stories = 5000
tokenizer_vocab_size = 4096

[train]
batch_size = 32
grad_accum_steps = 1
max_steps = 4500
warmup_steps = 200
lr_peak = 1e-3
lr_min = 1e-4
weight_decay = 0.1
beta1 = 0.9
beta2 = 0.95
grad_clip = 1.0
eval_interval = 250
eval_batches = 20
num_threads = 22
