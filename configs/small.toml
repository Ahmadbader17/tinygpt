# Real run: ~5.8M parameters. max_steps and num_threads come from `tinygpt bench`
# (see docs/DECISIONS.md 0006): 12 threads, ~2.7k tok/s, 7500 steps = 61.4M tokens = 1 epoch.
name = "small"
seed = 1337

[model]
vocab_size = 4096
context_length = 256
d_model = 256
n_layer = 6
n_head = 8
dropout = 0.1
attention_impl = "sdpa"

[data]
source = "tinystories"
train_stories = 300000
val_stories = 5000
tokenizer_vocab_size = 4096

[train]
batch_size = 32
grad_accum_steps = 1
max_steps = 7500
warmup_steps = 200
lr_peak = 1e-3
lr_min = 1e-4
weight_decay = 0.1
beta1 = 0.9
beta2 = 0.95
grad_clip = 1.0
eval_interval = 250
eval_batches = 20
num_threads = 12
